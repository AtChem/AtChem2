# Workflow to upload the PDF file of the AtChem2 user manual before
# merging a Pull Request from a fork
#
# The PDF file is generated by the `AtChem2 PDF build` workflow, which
# is automatically triggered when the LaTeX source files are modified
#
# ACTIONS:
# [*] https://github.com/marketplace/actions/checkout
# [*] https://github.com/marketplace/actions/download-a-build-artifact
# -------------------------------------------------------------------- #

name: AtChem2 PDF upload

# ------------------------------ EVENTS ------------------------------ #
# Controls when the workflow is activated
on:

  # Run manually from the Actions tab (maintainers only)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Name of fork (owner/repo)'
        required: true
      pr_branch:
        description: 'Name of branch'
        required: true

# ------------------------------ JOBS ------------------------------ #
# This workflow contains a single job called `upload_pdf_manual` which
# retrieves the most recent version of the user manual PDF (generated
# by `tex-build.yml` on the branch associated to the current PR) and
# pushes it to the PR using git
#
# NB: the last step requires the PAT_TOKEN of a maintainer
jobs:

  upload_pdf_manual:
    runs-on: ubuntu-slim
    permissions:
      actions: read
    env:
      PR_REPO: ${{ github.event.inputs.repo }}
      PR_BRANCH: ${{ github.event.inputs.pr_branch }}

    steps:

      # -------------------------------------------------------------
      # Retrieve the id of the most recent successful run of `tex-build.yml`
      # for the fork and branch associated with the current PR
      - name: Find pdf build run
        id: find_run_id
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/AtChem/AtChem2"
          # encode the branch name
          enc_branch=$(jq -rn --arg b "$PR_BRANCH" '$b|@uri')
          # query successful tex-build runs on the branch and keep the
          # most recent one from the fork linked to the current PR
          run=$(curl -sSf -H "Authorization: Bearer $GITHUB_TOKEN" \
                "${api_url}/actions/workflows/tex-build.yml/runs?branch=${enc_branch}&event=pull_request&status=success" \
                | jq -c --arg repo "$PR_REPO" '[.workflow_runs[] | select(.head_repository.full_name == $repo)][0] // empty')
          if [ -z "$run" ]; then
            echo "::error::no successful tex-build run found for ${PR_REPO}:${PR_BRANCH}"
            exit 1
          fi
          # save id of the most recent successful tex-build run
          jq -r '"run_id=\(.id)"' <<<"$run" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------
      # Download the PDF file to a temporary directory
      - name: Download pdf artifact
        uses: actions/download-artifact@v8
        with:
          name: AtChem2-Manual.pdf
          path: ${{ runner.temp }}/manual
          run-id: ${{ steps.find_run_id.outputs.run_id }}
          github-token: ${{ github.token }}

      # -------------------------------------------------------------
      # Check that the downloaded artifact is a pdf
      - name: Check pdf artifact
        run: |
          set -euo pipefail
          pdf_file="${RUNNER_TEMP}/manual/AtChem2-Manual.pdf"
          if [ ! -f "$pdf_file" ]; then
            echo "::error::AtChem2-Manual.pdf not found in downloaded artifact"
            exit 1
          fi
          if [ "$(file -b --mime-type "$pdf_file")" != "application/pdf" ]; then
            echo "::error::downloaded artifact is not a pdf"
            exit 1
          fi

      # -------------------------------------------------------------
      # Checkout the branch associated with the current PR
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_BRANCH }}
          repository: ${{ env.PR_REPO }}
          token: ${{ secrets.PAT_TOKEN }}

      # -------------------------------------------------------------
      # Push PDF file to branch using git
      - name: Push pdf to branch
        run: |
          set -euo pipefail
          mv "${RUNNER_TEMP}/manual/AtChem2-Manual.pdf" doc/AtChem2-Manual.pdf
          # configure git
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # commit and push pdf
          git add doc/AtChem2-Manual.pdf
          if git diff --cached --quiet -- doc/AtChem2-Manual.pdf; then
            echo "No changes to commit"
          else
            git commit -m "Update AtChem2-Manual.pdf (${PR_REPO}:${PR_BRANCH})"
            git push
          fi
