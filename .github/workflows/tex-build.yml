# Workflow to generate the PDF file of the AtChem2 user manual,
# using GitHub Actions
#
# ACTIONS:
# [*] https://github.com/marketplace/actions/checkout
# [*] https://github.com/marketplace/actions/github-action-with-texlive
# [*] https://github.com/marketplace/actions/upload-a-build-artifact
# -------------------------------------------------------------------- #

name: AtChem2 PDF build

# ------------------------------ EVENTS ------------------------------ #
# Controls when the workflow is activated
on:

  # Triggers when a pull request targeting the master branch is created
  # or updated, and any of the source files in `doc/` have been modified
  pull_request:
    branches: [ master ]
    paths:
      - 'doc/latex/**'
      - 'doc/figures/**'

# ------------------------------ JOBS ------------------------------ #
# This workflow contains a single job called `build_pdf_manual` which
# generates and saves the PDF file of the user manual
jobs:

  build_pdf_manual:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      # -------------------------------------------------------------
      # Checkout the branch associated with the current PR
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      # -------------------------------------------------------------
      # Setup TeXLive, install ImageMagick (requires `librsvg`), and
      # generate the PDF file using the script `make_manual_pdf.sh`
      - name: Setup TexLive & compile pdf
        uses: xu-cheng/texlive-action@v3
        with:
          scheme: full
          run: |  # action runs in a docker container (alpine linux)
            apk add imagemagick librsvg
            ./doc/make_manual_pdf.sh

      # -------------------------------------------------------------
      # Save PDF file as artifact
      - name: Save pdf file
        uses: actions/upload-artifact@v7
        with:
          path: doc/AtChem2-Manual.pdf
          if-no-files-found: error
          archive: false
