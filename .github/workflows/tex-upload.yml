# Workflow to upload the PDF file of the AtChem2 user manual before
# merging a Pull Request
#
# The file is generated by the `AtChem2 PDF build` workflow, which is
# automatically triggered when the LaTeX source files (.tex, .svg) are
# modified
# -------------------------------------------------------------------- #

name: AtChem2 PDF upload

# ------------------------------ EVENTS ------------------------------ #
# Controls when the workflow is activated
on:

  # Run manually from the Actions tab (maintainers only)
  workflow_dispatch:
    inputs:
      repo:
        description: 'Name of repo'
        required: true
      pr_branch:
        description: 'Name of branch'
        required: true

# ------------------------------ JOBS ------------------------------ #

# This workflow contains a single job called `upload_pdf_manual` which
# retrieves the most recent version of the user manual PDF file (generated
# by 'tex-build.yml') on the branch associated to the current PR and
# pushes it to the PR using git
jobs:

  upload_pdf_manual:
    # The job runs on the latest version of linux (ubuntu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_REPO: ${{ github.event.inputs.repo }}
      PR_BRANCH: ${{ github.event.inputs.pr_branch }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

    steps:

      # -------------------------------------------------------------
      # Checkout the branch linked to the current PR
      #
      # ACTION: https://github.com/marketplace/actions/checkout
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PR_BRANCH }}
          repository: ${{ env.PR_REPO }}
          token: ${{ env.PAT_TOKEN }}

      # -------------------------------------------------------------
      # Retrieve and verify the most recent PDF artifact generated by 'tex-build.yml'
      # on the branch linked to the current PR
      - name: Retrieve pdf artifact
        run: |
          set -euo pipefail
          # find the id of the artifacts from the latest successful run of the
          # `build_pdf_manual` job on the branch linked to the current PR
          run_id=$(curl -sSf -H "Authorization: Bearer $PAT_TOKEN" "https://api.github.com/repos/AtChem/AtChem2/actions/workflows/tex-build.yml/runs?branch=${PR_BRANCH}&event=pull_request&status=success&per_page=1" \
          | jq -r '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::error:: no successful tex-build run found for branch ${PR_BRANCH}"
            exit 1
          fi
          # find the id of the artifact called "AtChem2-Manual" from the selected run, if not expired
          arti_id=$(curl -sSf -H "Authorization: Bearer $PAT_TOKEN" "https://api.github.com/repos/AtChem/AtChem2/actions/runs/${run_id}/artifacts?name=AtChem2-Manual" \
          | jq -r '[.artifacts[] | select(.expired==false)][0].id // empty')
          if [ -z "$arti_id" ]; then
            echo "::error:: no artifact named 'AtChem2-Manual' found in run ${run_id}"
            exit 1
          fi
          # download artifact
          arti_url="https://api.github.com/repos/AtChem/AtChem2/actions/artifacts/${arti_id}/zip"
          curl -sSf -L -H "Authorization: Bearer $PAT_TOKEN" "$arti_url" --output artifact.zip

      - name: Check pdf artifact
        run: |
            unzip -o artifact.zip -d doc/
            if [ ! -f doc/AtChem2-Manual.pdf ]; then
              echo "[!] Artifact not found"
              exit 1
            else
              file_type="$(file -b --mime-type doc/AtChem2-Manual.pdf)"
              if [ "$file_type" != "application/pdf" ]; then
                echo "[!] Artifact not a pdf ($file_type)"
                exit 1
              fi
            fi

      # -------------------------------------------------------------
      # Push PDF file to branch using git
      - name: Push pdf to branch
        run: |
          # configure git
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # commit and push pdf
          git add doc/AtChem2-Manual.pdf
          if git diff --cached --quiet -- doc/AtChem2-Manual.pdf; then
            echo "No changes to commit"
          else
            git commit -m "Update AtChem2-Manual.pdf (${PR_REPO}:${PR_BRANCH})"
            git push
          fi
